<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S03 — The promise</title>
  <style>
    :root { color-scheme: dark; font-family: "Arial Narrow", "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #080a0d; color: #eaecef; }
    main { max-width: 1600px; margin: auto; padding: 22px 22px 32px; }
    header { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; }
    header::before, header::after { content: ""; height: 1px; background: #c8ccd3; flex: 1; }
    h1 { margin: 0; font: 600 clamp(20px, 2.2vw, 34px)/1.15 "Arial Narrow", "Segoe UI", sans-serif; letter-spacing: .18em; text-align: center; text-transform: uppercase; white-space: nowrap; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 14px; }
    figure { margin: 0; min-width: 0; }
    .frame { position: relative; aspect-ratio: 16 / 9; overflow: hidden; border: 2px solid #c8ccd3; background: #15191f; }
    .frame img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .number { position: absolute; top: 0; left: 0; min-width: 36px; padding: 5px 9px; background: #080a0d; border-right: 2px solid #c8ccd3; border-bottom: 2px solid #c8ccd3; font-size: 22px; font-weight: 700; line-height: 1; }
    figcaption { padding: 8px 2px 0; font-size: clamp(13px, 1.4vw, 19px); letter-spacing: .05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .time { font-weight: 700; }
    footer { margin-top: 22px; color: #9ca5b2; font-size: 13px; letter-spacing: .04em; }
    @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } header::before, header::after { display: none; } h1 { white-space: normal; text-align: left; } }
    @media print { body { background: #080a0d; print-color-adjust: exact; -webkit-print-color-adjust: exact; } }
  </style>
</head>
<body>
  <main>
    <header><h1>S03 — The promise | 15 seconds</h1></header>
    <section class="grid" aria-label="Shot sequence">
      <figure><div class="frame"><img src="../frames/S03-01-summer-overlook.png" alt="Zin Zin and Pyae Sone share a summer moment at the lighthouse overlook"><span class="number">1</span></div><figcaption><span class="time">30–34s</span> | WIDE — Summer memory</figcaption></figure>
      <figure><div class="frame"><img src="../frames/S03-02-pyaesone-draws.png" alt="Pyae Sone draws the white lighthouse while Zin Zin watches"><span class="number">2</span></div><figcaption><span class="time">34–38s</span> | CLOSE — He draws the promise</figcaption></figure>
      <figure><div class="frame"><img src="../frames/S03-03-postcard-handoff.png" alt="Pyae Sone slides the completed lighthouse postcard to Zin Zin"><span class="number">3</span></div><figcaption><span class="time">38–42s</span> | MEDIUM — He gives her the card</figcaption></figure>
      <figure><div class="frame"><img src="../frames/S03-04-postcard-present.png" alt="Zin Zin holds the lighthouse postcard and teal plush as rain begins"><span class="number">4</span></div><figcaption><span class="time">42–45s</span> | MEDIUM — Back to rain</figcaption></figure>
    </section>
    <footer>Production sheet · Every picture window is 16:9 · Captions and shot numbers are not part of the video</footer>
  </main>
</body>
</html>
