<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S04 — Almost on time</title>
  <style>
    :root { color-scheme: dark; font-family: "Arial Narrow", "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #080a0d; color: #eaecef; }
    main { max-width: 1600px; margin: auto; padding: 22px 22px 32px; }
    header { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; }
    header::before, header::after { content: ""; height: 1px; background: #c8ccd3; flex: 1; }
    h1 { margin: 0; font: 600 clamp(20px, 2.2vw, 34px)/1.15 "Arial Narrow", "Segoe UI", sans-serif; letter-spacing: .18em; text-align: center; text-transform: uppercase; white-space: nowrap; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 14px; }
    figure { margin: 0; min-width: 0; }
    .frame { position: relative; aspect-ratio: 16 / 9; overflow: hidden; border: 2px solid #c8ccd3; background-image: url('S04-combined.png'); background-size: 200% 200%; background-repeat: no-repeat; }
    .one { background-position: 0 0; }
    .two { background-position: 100% 0; }
    .three { background-position: 0 100%; }
    .four { background-position: 100% 100%; }
    .number { position: absolute; top: 0; left: 0; min-width: 36px; padding: 5px 9px; background: #080a0d; border-right: 2px solid #c8ccd3; border-bottom: 2px solid #c8ccd3; font-size: 22px; font-weight: 700; line-height: 1; }
    figcaption { padding: 8px 2px 0; font-size: clamp(13px, 1.4vw, 19px); letter-spacing: .05em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .time { font-weight: 700; }
    footer { margin-top: 22px; color: #9ca5b2; font-size: 13px; letter-spacing: .04em; }
    @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } header::before, header::after { display: none; } h1 { white-space: normal; text-align: left; } }
  </style>
</head>
<body>
  <main>
    <header><h1>S04 — Almost on time | 15 seconds</h1></header>
    <section class="grid" aria-label="Shot sequence from one combined image">
      <figure><div class="frame one" role="img" aria-label="Pyae Sone waits alone at the lighthouse overlook"><span class="number">1</span></div><figcaption><span class="time">45–49s</span> | MEDIUM WIDE — He waits</figcaption></figure>
      <figure><div class="frame two" role="img" aria-label="Zin Zin waits with the teal plush at a lower shelter along the hillside tram line"><span class="number">2</span></div><figcaption><span class="time">49–52s</span> | MEDIUM WIDE — She is delayed</figcaption></figure>
      <figure><div class="frame three" role="img" aria-label="Pyae Sone looks up at thickening clouds"><span class="number">3</span></div><figcaption><span class="time">52–56s</span> | CLOSE — His concern</figcaption></figure>
      <figure><div class="frame four" role="img" aria-label="Zin Zin looks up at thickening clouds"><span class="number">4</span></div><figcaption><span class="time">56–60s</span> | CLOSE — Same sky</figcaption></figure>
    </section>
    <footer>One generated sheet · Each picture window is 16:9 · Captions and numbers are not part of the video</footer>
  </main>
</body>
</html>
