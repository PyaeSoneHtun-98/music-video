<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S07 clean four-frame review sheet</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #05080d; }
    main { width: 100vw; height: 100vh; display: grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); gap: 2px; }
    img { width: 100%; height: 100%; object-fit: cover; display: block; }
  </style>
</head>
<body>
  <main aria-label="Four clean landscape frames for S07">
    <img src="../frames/S07-01-bus-between.png" alt="Bus separates Pyae Sone and Zin Zin at the junction">
    <img src="../frames/S07-02-zinzin-through-bus.png" alt="Zin Zin seen through the bus window">
    <img src="../frames/S07-03-pyaesone-through-bus.png" alt="Pyae Sone seen through the opposite bus window">
    <img src="../frames/S07-04-bus-clears.png" alt="Same fixed junction view after the bus moves away">
  </main>
</body>
</html>
